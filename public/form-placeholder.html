<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Placeholder for Netlify Bot</title>
</head>
<body>
  <!-- This file exists purely for Netlify's build crawler to register the form backend -->
  <form name="intake" data-netlify="true" method="POST">
    <input type="hidden" name="form-name" value="intake" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <select name="gear-type"></select>
    <textarea name="issue-description"></textarea>
  </form>
</body>
</html>
